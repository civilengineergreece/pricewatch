name: PriceWatch

on:
  schedule:
    - cron: "7 * * * *"      # κάθε ώρα, στο 7ο λεπτό
  workflow_dispatch:          # χειροκίνητη εκκίνηση από το tab Actions

concurrency:
  group: pricewatch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state (ιστορικό τιμών)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Run PriceWatch
        env:
          PRICEWATCH_DATA_DIR: state
          PW_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PW_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PW_PUBLIC_BEARER: ${{ secrets.PUBLIC_BEARER }}
          PW_DAILY_XLSX: "1"
          PYTHONIOENCODING: utf-8
        run: python pricewatch.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Keep latest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals
          path: |
            state/deals.xlsx
            state/deals.html
          retention-days: 3
          if-no-files-found: ignore
